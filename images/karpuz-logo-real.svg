<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="t d">
  <title id="t">KARPUZ Cocktail Bar logosu</title>
  <desc id="d">Yarım karpuz dilimi içinde KARPUZ yazısı ve kokteyl bardağı.</desc>
  <defs>
    <linearGradient id="flesh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fb4b40"/>
      <stop offset="1" stop-color="#d81e18"/>
    </linearGradient>
    <filter id="sh" x="-15%" y="-20%" width="130%" height="160%">
      <feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#000" flood-opacity=".4"/>
    </filter>
    <filter id="ts" x="-20%" y="-40%" width="140%" height="190%">
      <feDropShadow dx="3" dy="4" stdDeviation="1.4" flood-color="#6e0a07" flood-opacity=".7"/>
    </filter>
  </defs>

  <!-- KARPUZ DİLİMİ: üst düz kesik yüz, alt yeşil kavis -->
  <g filter="url(#sh)">
    <!-- dış koyu kontur -->
    <path d="M28 86 H732 Q732 350 380 350 Q28 350 28 86 Z" fill="#0d0f10"/>
    <!-- koyu yeşil kabuk -->
    <path d="M40 92 H720 Q720 340 380 340 Q40 340 40 92 Z" fill="#2f7d31"/>
    <!-- açık yeşil bant -->
    <path d="M40 92 H720 Q716 150 380 150 Q44 150 40 92 Z" fill="#0d0f10" opacity="0"/>
    <path d="M52 96 H708 Q708 322 380 322 Q52 322 52 96 Z" fill="#bfd472"/>
    <!-- beyaz iç çeper -->
    <path d="M64 99 H696 Q696 306 380 306 Q64 306 64 99 Z" fill="#fbeede"/>
    <!-- kırmızı iç dolgu -->
    <path d="M78 103 H682 Q682 290 380 290 Q78 290 78 103 Z" fill="url(#flesh)"/>

    <!-- çekirdekler (yazı çevresi/üst) -->
    <g fill="#16110d">
      <ellipse cx="150" cy="150" rx="6" ry="10.5" transform="rotate(-18 150 150)"/>
      <ellipse cx="610" cy="150" rx="6" ry="10.5" transform="rotate(18 610 150)"/>
      <ellipse cx="120" cy="210" rx="6" ry="10.5" transform="rotate(-26 120 210)"/>
      <ellipse cx="640" cy="210" rx="6" ry="10.5" transform="rotate(26 640 210)"/>
      <ellipse cx="200" cy="258" rx="6" ry="10.5" transform="rotate(-14 200 258)"/>
      <ellipse cx="290" cy="272" rx="6" ry="10.5" transform="rotate(-7 290 272)"/>
      <ellipse cx="380" cy="276" rx="6" ry="10.5"/>
      <ellipse cx="470" cy="272" rx="6" ry="10.5" transform="rotate(7 470 272)"/>
      <ellipse cx="560" cy="258" rx="6" ry="10.5" transform="rotate(14 560 258)"/>
    </g>
  </g>

  <!-- KARPUZ wordmark: kırmızı içinde, koyu kırmızı dolgu + beyaz kontur -->
  <text x="380" y="218" text-anchor="middle"
        font-family="'Anton','Arial Black',sans-serif" font-size="132" font-weight="900"
        fill="#b3120d" stroke="#fff" stroke-width="6" paint-order="stroke"
        filter="url(#ts)" letter-spacing="3">KARPUZ</text>

  <!-- kokteyl bardağı, P harfi üzerinde -->
  <g transform="translate(470 70)" filter="url(#sh)">
    <path d="M0 0 L48 0 L27 32 L27 58 L37 58 L11 58 L21 58 L21 32 Z" fill="#ffd23f" stroke="#6e0a07" stroke-width="3" stroke-linejoin="round"/>
    <rect x="31" y="-22" width="4.5" height="36" rx="2.2" fill="#e21d18" transform="rotate(20 33 -4)"/>
    <circle cx="43" cy="-22" r="7.5" fill="#e21d18"/>
    <circle cx="30" cy="-30" r="4.5" fill="#ffd23f"/>
  </g>
</svg>
